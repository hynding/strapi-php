name: Publish create-strapi-app

# strapi-php is published as one Composer package, hynding/strapi-php (the repository root,
# which `replace`s every strapi/* package). The project generator is the exception:
# `composer create-project` uses a package's root as the new project, so
# hynding/create-strapi-app needs a repository of its own. This pushes packages/cli/create-strapi-app
# to the read-only repository strapi-php-create-strapi-app on every release tag.
#
# Requires a SPLIT_TOKEN secret with repo scope and the target repository to exist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: symplify/monorepo-split-github-action@v2.3.0
        with:
          tag: ${{ github.ref_name }}
          package_directory: packages/cli/create-strapi-app
          repository_organization: ${{ github.repository_owner }}
          repository_name: strapi-php-create-strapi-app
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
