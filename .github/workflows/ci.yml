name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, pdo_pgsql, fileinfo
          coverage: none
      - run: composer validate --strict --no-check-publish --no-check-version
      - run: composer install --no-interaction --prefer-dist
      - run: composer version:check
      - run: composer bundle:check
      - run: composer analyse
      - run: composer test

  example-boot:
    name: getstarted example boots on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - run: cp examples/getstarted/.env.example examples/getstarted/.env
      - run: php examples/getstarted/bin/strapi routes:list
      - run: php tests/php/smoke.php

  example-boot-mysql:
    name: getstarted example boots on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: strapi
          MYSQL_DATABASE: strapi
          MYSQL_USER: strapi
          MYSQL_PASSWORD: strapi
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - run: cp examples/getstarted/.env.example examples/getstarted/.env
      # boots on the empty database, so it creates every table (MySQL commits each DDL statement)
      - run: php tests/php/smoke.php

  example-plugin:
    name: announcements plugin on Strapi (spec in sync, conformance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/plugins/announcements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/plugins/announcements/package-lock.json
      - run: npm ci
      # generated types current, every server .ts has its .php twin, manifests in lockstep
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      # the same fixtures run against strapi-php in the php job (composer test)
      - run: npm run test:conformance
