; PHP settings for the FrankenPHP worker the API suite starts (lib/server.js adds this
; directory to PHP_INI_SCAN_DIR).
;
; koa-body keeps every part of a multipart body, repeated fields included (`files` sent
; several times, `fileInfo` per file). PHP's own multipart parser keeps only the last of a
; repeated field, so leave the body unparsed and let strapi::body (core's middlewares/body.php)
; parse php://input itself.
enable_post_data_reading = Off

; worker startup (register/bootstrap with the harness pausing between phases) counts against
; max_execution_time in FrankenPHP; Node has no such limit
max_execution_time = 0
