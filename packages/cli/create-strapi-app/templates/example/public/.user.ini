; PHP-FPM and CGI read this file (Apache's mod_php does not: use `php_flag enable_post_data_reading Off`
; in .htaccess there). It leaves multipart bodies to strapi::body, which keeps every file of an upload
; that sends several under one name, as Strapi does; PHP's own parser keeps only the last of them.
; `strapi develop` and `strapi start` pass the same setting to PHP's built-in server.
enable_post_data_reading = Off
